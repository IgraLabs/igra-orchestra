volumes:
  ethrex_data:
  ethrex_ipc:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m

services:
  execution-layer:
    build:
      context: build/repos/ethrex
      dockerfile: Dockerfile
      args: !override
        PROFILE: release
    image: igranetwork/ethrex:${ETHREX_VERSION}
    container_name: galleon-execution-layer
    entrypoint: /app/run-igra-el.sh
    ports: !override
      - "127.0.0.1:19545:8545"
      - "127.0.0.1:19546:8546"
    expose: !override
      - "8545"
      - "8546"
      - "8551"
      - "9001"
    volumes: !override
      - ethrex_data:/app/data/
      - ./keys/jwt.hex:/app/jwt.hex
      - ethrex_ipc:/app/socket
      - ./network-params:/app/network-params
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -lc ': > /dev/tcp/127.0.0.1/8545' &&
          bash -lc ': > /dev/tcp/127.0.0.1/8546' &&
          bash -lc ': > /dev/tcp/127.0.0.1/8551'
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s

  kaspad:
    container_name: galleon-kaspad
    ports: !override
      - "46210:16210"
      - "46211:16211"
      - "47210:17210"
      - "48210:18210"

  node-health-check-client:
    container_name: galleon-node-health-check-client
    environment:
      - NODE_RPC_URL=http://execution-layer:8545
      - MONITOR_URL=http://${NODE_HEALTH_CHECK_URL}:8081
      - NODE_ID=${NODE_ID}
      - API_KEY=${HEALTH_CHECK_API_KEY}
      - POLL_INTERVAL=8
      - NETWORK=${NETWORK}
      - GENESIS_BLOCK_HASH=${GENESIS_BLOCK_HASH}
      - KASPAD_VERSION=${KASPAD_VERSION}
      - RETH_VERSION=${ETHREX_VERSION}
      - ETHREX_VERSION=${ETHREX_VERSION}
      - KASWALLET_VERSION=${KASWALLET_VERSION}
      - RPC_PROVIDER_VERSION=${RPC_PROVIDER_VERSION}
      - NODE_HEALTH_CHECK_VERSION=${NODE_HEALTH_CHECK_VERSION}
      - ATAN_UPLOADER_VERSION=${ATAN_UPLOADER_VERSION}

  rpc-provider-0:
    container_name: galleon-rpc-provider-0
  kaswallet-0:
    container_name: galleon-kaswallet-0
    ports: !override
      - "127.0.0.1:18082:8082"
