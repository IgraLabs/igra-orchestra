[workspace]
resolver = "2"
members = [
    "reconciler",
    "log_parser",
    "loadgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
