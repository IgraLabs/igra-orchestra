[package]
name = "log_parser"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "log_parser"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Error handling
thiserror = { workspace = true }

# CSV handling
csv = "1.3"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# File watching
notify = "7.0"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Signal handling
tokio-util = "0.7"

# Date/time handling
chrono = "0.4"

[dev-dependencies]
tempfile = "3.15"
