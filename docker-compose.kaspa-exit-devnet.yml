name: ${COMPOSE_PROJECT_NAME:-igra-kaspa-exit-devnet}

volumes:
  kaspad_data:
    name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-kaspad-data
  reth_data:
    name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-reth-data
  reth_ipc:
    name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-reth-ipc
  traefik_certs:
    name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-traefik-certs
  kaspa_safe_postgres:
    name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-safe-postgres

networks:
  igra-network:
    name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-igra
    ipam:
      config:
        - subnet: ${KASPA_EXIT_DEVNET_SUBNET:-172.31.93.0/24}
  traefik-network:
    name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-traefik

services:
  kaspad:
    container_name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-kaspad
    ports: !override
      - "127.0.0.1:${KASPAD_GRPC_PORT:-16610}:${KASPAD_GRPC_PORT:-16610}"
      - "127.0.0.1:${KASPAD_P2P_PORT:-16611}:${KASPAD_P2P_PORT:-16611}"
      - "127.0.0.1:${KASPAD_BORSH_PORT:-17610}:${KASPAD_BORSH_PORT:-17610}"
      - "127.0.0.1:${KASPAD_JSON_PORT:-18610}:${KASPAD_JSON_PORT:-18610}"

  execution-layer:
    container_name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-execution-layer
    ports: !override
      - "127.0.0.1:${EL_HTTP_HOST_PORT:-9545}:8545"
      - "127.0.0.1:${EL_WS_HOST_PORT:-9546}:8546"

  kaspa-miner:
    container_name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-kaspa-miner
    cpus: "${KASPA_MINER_CPUS:-2.00}"

  kaspa-safe-db:
    image: postgres:18-alpine
    profiles: ["kaspa-exit-e2e"]
    container_name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-safe-db
    restart: ${SERVICE_RESTART_POLICY:-no}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - kaspa_safe_postgres:/var/lib/postgresql
    networks:
      - igra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  kaspa-safe-redis:
    image: redis:alpine
    profiles: ["kaspa-exit-e2e"]
    container_name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-safe-redis
    restart: ${SERVICE_RESTART_POLICY:-no}
    networks:
      - igra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  kaspa-safe-api:
    build:
      context: .
      dockerfile: build/Dockerfile.kaspa-exit-safe-api
    image: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-safe-api:local
    profiles: ["kaspa-exit-e2e"]
    container_name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-safe-api
    restart: ${SERVICE_RESTART_POLICY:-no}
    depends_on:
      kaspa-safe-db:
        condition: service_healthy
      kaspa-safe-redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-kaspa-exit-devnet-secret}
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: psql://postgres:postgres@kaspa-safe-db:5432/postgres
      REDIS_URL: redis://kaspa-safe-redis:6379/0
      CELERY_BROKER_URL: django://
      ETH_L2_NETWORK: "0"
      ETHEREUM_NODE_URL: http://execution-layer:8545
      ETHEREUM_TRACING_NODE_URL: http://execution-layer:8545
      KASPA_PST_HELPER_PATH: /usr/local/bin/kaspa-pst
      KASPA_PST_HELPER_TIMEOUT: "60"
      WEB_CONCURRENCY: ${SAFE_API_WEB_CONCURRENCY:-1}
    command:
      - bash
      - -lc
      - |
        /app/.venv/bin/python manage.py migrate kaspa --noinput
        exec /app/.venv/bin/gunicorn --config gunicorn.conf.py --pythonpath "$$PWD" -b 0.0.0.0:8888 config.wsgi:application
    volumes:
      - ./build/kaspa-exit-devnet:/work
    ports:
      - "127.0.0.1:${SAFE_API_HOST_PORT:-9888}:8888"
    networks:
      - igra-network
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8888/check/", timeout=2).read()'
      interval: 10s
      timeout: 5s
      retries: 30

  kaspa-wallet-tools:
    build:
      context: .
      dockerfile: build/Dockerfile.kaspa-exit-wallet-tools
    image: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-wallet-tools:local
    profiles: ["kaspa-exit-e2e"]
    container_name: ${KASPA_EXIT_DEVNET_CONTAINER_PREFIX:-igra-kaspa-exit-devnet}-wallet-tools
    restart: ${SERVICE_RESTART_POLICY:-no}
    depends_on:
      kaspad:
        condition: service_healthy
    environment:
      NETWORK: ${NETWORK:-devnet}
      WALLET_PASSWORD: ${WALLET_PASSWORD:-stage-msig-pass}
      KASPAD_RPC_HOST: kaspad
      KASPAD_GRPC_PORT: ${KASPAD_GRPC_PORT:-16610}
      SAFE_API_BASE_URL: http://kaspa-safe-api:8888/api/v1/kaspa
      KASPA_E2E_SPEND_AMOUNT_KAS: ${KASPA_E2E_SPEND_AMOUNT_KAS:-1}
      KASPA_E2E_FEE_RATE: ${KASPA_E2E_FEE_RATE:-1}
      KASPA_E2E_COINBASE_MATURITY_DAA: ${KASPA_E2E_COINBASE_MATURITY_DAA:-1000}
      KASPA_E2E_POLL_SECONDS: ${KASPA_E2E_POLL_SECONDS:-2}
    volumes:
      - ./build/kaspa-exit-devnet:/work
    networks:
      - igra-network
